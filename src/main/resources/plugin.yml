name: MinecartOrbital
version: ${project.version}
main: com.minecartorbital.MinecartOrbital
api-version: "26.3"
description: Summons TNT Minecarts from the sky.
author: You

commands:
  minecartorbital:
    description: Rain TNT Minecarts from the sky around you.
    usage: /<command> [count] [radius]
    permission: minecartorbital.use
  minecartorbitalrod:
    description: Get the unbreakable Minecart Orbital fishing rod.
    usage: /<command> [count] [radius]
    permission: minecartorbital.rod

permissions:
  minecartorbital.use:
    description: Allows use of /minecartorbital
    default: op
  minecartorbital.rod:
    description: Allows /minecartorbitalrod and using the rod
    default: op
